map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Preserve non-default ports for the backend's same-origin session checks.
# Keep the previous fallback for HTTP requests without a Host header.
map $http_host $upstream_host {
    default $http_host;
    "" $host;
}

# The external TLS proxy connects to this frontend over HTTP. Preserve its
# protocol so Uvicorn does not turn HTTPS redirects into blocked HTTP requests.
# The edge proxy must overwrite this header; accept only the two HTTP schemes.
map $http_x_forwarded_proto $upstream_scheme {
    default $scheme;
    http http;
    https https;
}

server {
    listen 8484;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS disabled - enable only when HTTPS is configured
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-src 'self' blob: https://www.youtube-nocookie.com;" always;


    # WebSocket proxy
    location /socket.io/ {
        # ${APP_NAME}-back is the container name on the private Docker network.
        proxy_pass http://${APP_NAME}-back:8000;
        
        # Headers required to keep the WebSocket open.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, rather than append, client-controlled forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/ {
         proxy_pass http://${APP_NAME}-back:8000;
        
        # WebSocket configuration
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Forwarded identity headers
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;

        # Extended timeouts prevent idle disconnections.
        # The bot remains connected even when silent for one hour.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Native Chat attachments are streamed and bounded again by the application.
    # Keep the large gateway allowance scoped to this single upload endpoint.
    location ~ ^/api/chat/rooms/[^/]+/attachments/?$ {
        proxy_pass http://${APP_NAME}-back:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 1G;
    }

    # Skill packages have their own 50 MiB archive and 200 MiB expanded limits.
    location = /api/skills/import {
        proxy_pass http://${APP_NAME}-back:8000;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_request_buffering off;
        client_max_body_size 52M;
    }

    # Generated HTML previews are served as short-lived, sandboxed capability
    # documents. Their own CSP permits CDN dependencies without relaxing the SPA.
    location ~ "^/api/chat/html-previews/[0-9a-f]{32}/?$" {
        proxy_pass http://${APP_NAME}-back:8000;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads allow-presentation; default-src * data: blob: 'unsafe-inline'; script-src * data: blob: 'unsafe-inline' 'unsafe-eval'; style-src * data: blob: 'unsafe-inline'; connect-src * data: blob: ws: wss:; img-src * data: blob:; font-src * data: blob:; media-src * data: blob:; worker-src * data: blob:; frame-src * data: blob:" always;
    }

    # API proxy (Nginx in production, Vite in development). Ordinary JSON,
    # forms, avatars, dictation and webhooks do not need attachment-sized bodies.
    location /api/ {
        proxy_pass http://${APP_NAME}-back:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 16M;
    }

    # Serve index.html for every other request (SPA routing).
    # Service workers must always be revalidated so installed applications can
    # discover a new deployment immediately.
    location = /sw.js {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # These stable bootstrap URLs must be revalidated on every deployment.
    # Hashed application assets remain cacheable independently.
    location = /registerSW.js {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Public files
    location /public/ {
        alias /app/public;
        # These URLs are not content-hashed and can change during an update.
        expires off;
        add_header Cache-Control "no-cache" always;
    }

    # Static asset cache
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires off;
        add_header Cache-Control "no-cache" always;
    }
}
