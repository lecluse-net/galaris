name: Publish release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release check
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Record the source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require exact-commit security CI and fresh source security
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHECK_TIMEOUT_SECONDS: '2400'
        run: make release-check
      - name: Preserve pre-publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check
          path: artifacts/release-check/
          retention-days: 30

  desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build installers without publishing
        shell: bash
        env:
          DESKTOP_VERSION: ${{ inputs.tag || github.ref_name }}
          DESKTOP_REQUIRE_SIGNING: ${{ runner.os == 'Windows' && '1' || '0' }}
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.DESKTOP_WINDOWS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.DESKTOP_WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          set -euo pipefail
          [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npx electron-builder --config electron-builder.cjs --publish never --x64 \
            -c.extraMetadata.version="$DESKTOP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [preflight, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: artifacts/desktop-release
      - name: Extract curated release notes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          awk -v tag="$RELEASE_TAG" \
            -v source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/" '
            index($0, "## [" tag "] - ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found {
              gsub(/\]\(docs\//, "](" source_url "docs/")
              print
            }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '^### ' "$RUNNER_TEMP/release-notes.md"
      - name: Publish source and desktop installers together
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$RELEASE_COMMIT" ]]; then
            echo '::error::Release tag changed after qualification; publication blocked.'
            exit 1
          fi
          cd artifacts/desktop-release
          assets=(
            "Galaris-$RELEASE_TAG-x64.exe"
            "Galaris-$RELEASE_TAG-x64.exe.blockmap"
            "Galaris-$RELEASE_TAG-x86_64.AppImage"
            "Galaris-$RELEASE_TAG-amd64.deb"
            latest.yml
            latest-linux.yml
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing or empty desktop release asset: $asset"
              exit 1
            fi
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo "Release $RELEASE_TAG already exists; leaving it unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Galaris $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
