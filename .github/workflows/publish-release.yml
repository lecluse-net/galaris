name: Publish release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release check
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 260
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Record the source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require exact-commit CI and fresh source security
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHECK_TIMEOUT_SECONDS: '14400'
        run: make release-check
      - name: Preserve pre-publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check
          path: artifacts/release-check/
          retention-days: 30

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Extract curated release notes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          awk -v tag="$RELEASE_TAG" \
            -v source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/" '
            index($0, "## [" tag "] - ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found {
              gsub(/\]\(docs\//, "](" source_url "docs/")
              print
            }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '^### ' "$RUNNER_TEMP/release-notes.md"
      - name: Publish source release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$RELEASE_COMMIT" ]]; then
            echo '::error::Release tag changed after qualification; publication blocked.'
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Galaris $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
