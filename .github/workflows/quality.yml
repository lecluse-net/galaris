name: Quality
run-name: Quality / ${{ github.event_name == 'workflow_dispatch' && inputs.full == true && 'full' || 'quick' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete functional suites, including all browsers and recovery tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.full == true && 'full' || 'quick' }}
  cancel-in-progress: true

jobs:
  required:
    name: Quality required
    if: always()
    needs: [static, providers, backend-tests, frontend-components, chat-e2e, restore, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
        run: >-
          jq -e --arg event "$EVENT" --arg full "$FULL"
          'to_entries | all(.[];
          .value.result == "success" or
          (.key == "dependency-review" and $event != "pull_request" and .value.result == "skipped") or
          ($full == "false" and .value.result == "skipped" and
          (.key | IN("providers", "backend-tests", "frontend-components", "chat-e2e", "restore"))))'
          <<< "$RESULTS"

  static:
    name: Types, build, architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare non-production secrets
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=prod$/APP_ENV=test/' .env
          bash bin/update-secrets.sh

      - name: Build backend quality image
        run: >-
          docker build
          --build-context harness_manager=./harness_manager
          --build-context code_executor=./code-executor
          --build-context product_docs=./docs
          --build-context project_docs=./project
          --target builder --tag galaris-back-quality back

      - name: Backend strict typing
        run: >-
          docker run --rm --network none
          --env APP_ENV=test
          --env AUTH_SECRET_KEY=ci-auth-secret-ci-auth-secret-0001
          --env BROWSER_EXECUTOR_TOKEN=ci-browser-token-ci-browser-00001
          --env ENCRYPTION_MASTER_KEY=ci-encryption-secret-ci-encryption-01
          galaris-back-quality
          python -m pyright

      - name: High-confidence Python lint
        run: docker run --rm galaris-back-quality ruff check app core bridge scripts main.py
      - name: Every backend source has a coverage floor
        run: >-
          docker run --rm galaris-back-quality
          python scripts/check_critical_coverage.py --check-inventory --config coverage-all-domains.json
      - name: Format extracted reliability modules
        run: docker run --rm galaris-back-quality python scripts/check_format.py --check

      - name: Generated map is current
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          galaris-back-quality
          python back/scripts/project_context.py --root /repo --check

      - name: Architecture contracts
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          galaris-back-quality
          python back/scripts/architecture_check.py --root /repo

      - name: Frontend production build and strict typing
        run: docker build --target build-stage --tag galaris-front-quality front

      - name: Frontend transfer budgets
        run: docker run --rm galaris-front-quality npm run check:build-budgets

      - name: Frontend unit tests
        run: docker run --rm galaris-front-quality npm test

      - name: Type checking rejects application and build configuration regressions
        run: docker run --rm galaris-front-quality npm run test:tooling

      - name: Frontend TypeScript and Vue lint
        run: docker run --rm galaris-front-quality npm run lint

      - name: Frontend translation catalogs
        run: docker run --rm galaris-front-quality npm run i18n-check

      - name: Focused browser tests cannot bypass the suite
        run: make tests-focus-gates

      - name: Development and production update commands
        run: make tests-update

      - name: Publication rejects failed, missing or stale evidence
        run: make tests-release-check

      - name: Audit shipped frontend dependencies
        run: >-
          docker run --rm
          galaris-front-quality
          npm audit --omit=dev --audit-level=high

      - name: Browser executor build and tests
        run: |
          docker build --tag galaris-browser-quality browser-executor
          docker run --rm galaris-browser-quality npm test
          docker run --rm galaris-browser-quality npm audit --omit=dev --audit-level=high

  providers:
    name: Provider SDK and admission contracts
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated configuration
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=prod$/APP_ENV=test/' .env
          bash bin/update-secrets.sh
      - name: Exercise SDK requests, provider policies and Task admission
        run: make tests-providers
      - name: Preserve provider contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-contracts
          path: artifacts/provider-contracts.xml
          retention-days: 14

  backend-tests:
    name: Backend tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare isolated test configuration
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=prod$/APP_ENV=test/' .env
          bash bin/update-secrets.sh

      - name: Run complete backend suite with critical branch coverage
        env:
          COVERAGE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$COVERAGE_DIFF_BASE" =~ ^0+$ ]]; then unset COVERAGE_DIFF_BASE; fi
          make tests-coverage
      - name: Lifecycle tests detect weakened guards
        run: make tests-mutations
      - name: Regression evidence remains executable
        run: make regression-check
      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-branch-coverage
          path: |
            artifacts/coverage.xml
            artifacts/coverage-domains.json
            artifacts/coverage-full.xml
            artifacts/coverage-full.json
            artifacts/coverage-all-floors.json
            artifacts/coverage-html/
            artifacts/backend-junit.xml
            artifacts/mutations.json
            artifacts/regression-evidence.json
          retention-days: 14

  frontend-components:
    name: Vue component behaviors
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Exercise Vue components in an isolated browser
        run: make tests-front-components ARGS='--max-failures=0'
      - name: Preserve component traces and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-components
          path: artifacts/front-components/
          retention-days: 7

  chat-e2e:
    name: Browser workflows and PWA / ${{ matrix.browser }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated workflows on ${{ matrix.browser }}
        run: make tests-e2e ARGS='--project=${{ matrix.browser }} --repeat-each=1 --max-failures=0'
      - name: Preserve browser traces and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-e2e-${{ matrix.browser }}
          path: artifacts/e2e/
          retention-days: 7

  restore:
    name: Restore and runtime recovery rehearsal
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare isolated test configuration
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=prod$/APP_ENV=test/' .env
          bash bin/update-secrets.sh
      - run: make tests-restore
      - name: Select previous semantic release tag
        run: |
          set -euo pipefail
          previous=$(git tag --merged HEAD^ --sort=-version:refname |
            awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found = 1 }')
          [[ -n "$previous" ]] || { echo 'No previous semantic release tag found.' >&2; exit 1; }
          printf 'UPGRADE_FROM=%s\n' "$previous" >> "$GITHUB_ENV"
          echo "Upgrade baseline: $previous ($(git rev-parse "$previous^{commit}"))"
      - name: Rehearse populated database upgrade
        run: make tests-upgrade
      - run: make tests-harness-manager
      - run: make tests-executor

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
