name: Release artifact

on:
  workflow_dispatch:
    inputs:
      previous_backend_image:
        description: Previously deployed backend image digest (registry/name@sha256:...)
        required: true
        type: string
      publish_to_ghcr:
        description: Publish the successfully qualified bundle to GitHub Container Registry
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Prepare isolated checks
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=prod$/APP_ENV=test/' .env
          bash bin/update-secrets.sh
      - run: make tests
      - run: make tests-restore
      - name: Build immutable production bundle
        run: RELEASE_DIR=artifacts/release make build-release
      - name: Rehearse upgrade between exact production images
        env:
          UPGRADE_PREVIOUS_IMAGE: ${{ inputs.previous_backend_image }}
          UPGRADE_CANDIDATE_IMAGE: galaris-release-back:${{ github.sha }}
          UPGRADE_EVIDENCE_DIR: artifacts/release
        run: make tests-upgrade
      - name: Test and scan the exact exported production images
        run: RELEASE_DIR=artifacts/release make tests-release
      - name: Preserve release for promotion without rebuilding
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: artifacts/release/
          retention-days: 14

  publish:
    name: Publish qualified server bundle
    if: ${{ inputs.publish_to_ghcr }}
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: artifacts/release
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: '1.3.6'
      - name: Verify and publish the exact bundle
        working-directory: artifacts/release
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          cmp IMAGE_IDS TESTED_IMAGE_IDS
          sha256sum --check --strict SHA256SUMS

          repository="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          reference="$repository:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          digest=$(oras push "$reference" \
            --artifact-type application/vnd.galaris.server-bundle.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --format 'go-template={{.digest}}' \
            SOURCE_COMMIT:text/plain IMAGE_IDS:text/plain TESTED_IMAGE_IDS:text/plain \
            compose.release.yaml:application/yaml images.tar.gz:application/gzip \
            MANAGED_HARNESSES:text/plain UPGRADE_QUALIFICATION.json:application/json \
            QUALIFICATION.json:application/json SHA256SUMS:text/plain)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Server bundle for commit %s\n\n%s@%s\n' \
            "$GITHUB_SHA" "$repository" "$digest" >> "$GITHUB_STEP_SUMMARY"
