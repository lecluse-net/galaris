name: Release artifact

on:
  workflow_dispatch:
    inputs:
      previous_backend_image:
        description: Previously deployed backend image digest (registry/name@sha256:...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Prepare isolated checks
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=prod$/APP_ENV=test/' .env
          bash bin/update-secrets.sh
      - run: make tests
      - run: make tests-restore
      - name: Build immutable production bundle
        run: RELEASE_DIR=artifacts/release make build-release
      - name: Rehearse upgrade between exact production images
        env:
          UPGRADE_PREVIOUS_IMAGE: ${{ inputs.previous_backend_image }}
          UPGRADE_CANDIDATE_IMAGE: galaris-release-back:${{ github.sha }}
          UPGRADE_EVIDENCE_DIR: artifacts/release
        run: make tests-upgrade
      - name: Test and scan the exact exported production images
        run: RELEASE_DIR=artifacts/release make tests-release
      - name: Preserve release for promotion without rebuilding
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: artifacts/release/
          retention-days: 14
