name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Dependencies, secrets and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make security-check

  images:
    name: Image / ${{ matrix.context }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        context: [back, front, browser-executor, ssh-executor]
    steps:
      - uses: actions/checkout@v4
      - name: Build shipped image
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          extra=()
          if [[ "$BUILD_CONTEXT" == back ]]; then
            extra+=(--build-context harness_manager=./harness_manager)
            extra+=(--build-context code_executor=./code-executor)
            extra+=(--build-context product_docs=./docs --build-context project_docs=./project)
          fi
          if [[ "$BUILD_CONTEXT" == ssh-executor ]]; then
            extra+=(--build-context console_assets=./back/app/console/assets)
          fi
          docker build --pull "${extra[@]}" -t galaris-security-image "$BUILD_CONTEXT"
      - run: bash bin/security-check.sh image galaris-security-image
      - name: Preserve complete vulnerability inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.context }}
          path: artifacts/security/
          retention-days: 30

  required:
    name: Security required
    if: always()
    needs: [source, images]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
