[project]
name = "galaris-harness-manager"
version = "1.1.0"
description = "FastAPI service managing generic harness Docker Compose instances"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "cryptography",
    "loguru"
]

[tool.uv]
package = false
# CVE-2026-126360: retain the security floor while this API is pulled in transitively.
constraint-dependencies = ["opentelemetry-api>=1.45.2"]
