services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_REF: ${DSH_REF:?DSH_REF is required}
        RUNTIME_UID: ${RUNTIME_UID:?RUNTIME_UID is required}
        RUNTIME_GID: ${RUNTIME_GID:?RUNTIME_GID is required}
    image: ${DSH_IMAGE:?DSH_IMAGE is required}
    container_name: ${CONTAINER_NAME:?CONTAINER_NAME is required}
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:?DEEPSEEK_BASE_URL is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      GALARIS_MCP_URL: ${GALARIS_MCP_URL:?GALARIS_MCP_URL is required}
      GALARIS_MCP_TOKEN: ${GALARIS_MCP_TOKEN:?GALARIS_MCP_TOKEN is required}
      HARNESS_API_TOKEN: ${HARNESS_API_TOKEN:?HARNESS_API_TOKEN is required}
      HARNESS_MODEL: ${HARNESS_MODEL:?HARNESS_MODEL is required}
      DSH_CWD: /workspace
      DSH_SESSION_ROOT: /sessions
      DSH_CORDIS_CONFIG: /opt/galaris/cordis.yml
      DSH_REQUEST_TIMEOUT_SECONDS: "900"
    volumes:
      - ./data/workspace:/workspace
      - ./data/sessions:/sessions
      - ./data/skills:/skills:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 4.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
