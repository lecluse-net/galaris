# Patch layer for the pinned SDK profile. Existing entries are addressed by id;
# new entries MUST use insert, otherwise DSH skips them with a warning.
- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

# The native DeepSeek adapter now speaks Messages exclusively. Keep Galaris's
# OpenAI gateway through the upstream generic pi-ai adapter instead.
- id: llm-pi-ai
  config:
    providers:
      deepseek-official:
        displayName: Galaris
        api: openai-completions
        baseURL: !!js process.env.DEEPSEEK_BASE_URL
        apiKeyEnv: DEEPSEEK_API_KEY
        # pi-ai derives a request limit even without an explicit model maxTokens.
        # Let the gateway use the selected provider's published output capacity.
        headers: !!js >-
          ({
            "X-Galaris-Output-Budget": "provider",
            ...(process.env.GALARIS_DEEP_CONTEXT ? {
              "X-Galaris-Deep-Context": process.env.GALARIS_DEEP_CONTEXT
            } : process.env.GALARIS_RUN_CONTEXT ? {
              "X-Galaris-Run-Context": process.env.GALARIS_RUN_CONTEXT,
              "X-Galaris-Task-Id": process.env.GALARIS_TASK_ID
            } : {})
          })
        reasoning: !!js process.env.DSH_REASONING_EFFORT ?? 'high'
        retryPolicy:
          mode: normal
          maxRetries: 0
        compat:
          supportsReasoningEffort: true
          thinkingFormat: deepseek
          requiresReasoningContentOnAssistantMessages: true
        models:
          - id: !!js process.env.GALARIS_MODEL
            contextWindow: 262144
            reasoningEfforts:
              low: low
              high: high
              max: max

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD

- id: bash-sandbox
  config:
    timeoutMs: 60000

- id: system-prompt
  config:
    persona: !!js >-
      process.env.GALARIS_DEEP_PROFILE_PATH !== undefined ? '' :
      'You execute bounded Galaris tasks. Galaris remains authoritative for memory, files, messages, permissions, and external effects. Use the galaris MCP tools for durable work and never treat your final prose as proof that an effect happened.'

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: [/skills]
    watch: false

# Keep independent workflows and SDK desktop integrations out of the managed profile.
# Galaris's MCP tools own durable work, user questions and delivery.
- id: tool-plugin-manager
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: agent-team
  disabled: true
- id: tool-agent-team
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-web
  disabled: true
- id: schedule
  disabled: true
- id: tool-schedule
  disabled: true
- id: tool-ask-user
  disabled: true
- id: tool-office
  disabled: true
- id: skill-office
  disabled: true
- id: present
  disabled: true
- id: file-reference-local
  disabled: true
- id: deliverable-file-references
  disabled: true
- id: session-telemetry-otel
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: zstd

- id: tool-todo
  config:
    allowParallelInProgress: false

- id: compaction-basic
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

- insert:
    - id: galaris-deep-prompt
      name: /opt/galaris/deep_prompt.mjs
      disabled: !!js 'process.env.GALARIS_DEEP_PROFILE_PATH === undefined'
    - id: galaris-authorizations
      name: /opt/galaris/authorization.mjs
    - id: mcp-galaris
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: galaris
        transport: streamable-http
        url: !!js process.env.GALARIS_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.GALARIS_MCP_TOKEN}`'
        toolCallTimeoutMs: 86400000
        failOnStartupError: true
