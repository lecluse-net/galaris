# Patch layer for the pinned SDK profile. Existing entries are addressed by id;
# new entries MUST use insert, otherwise DSH skips them with a warning.
- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

# The native DeepSeek adapter now speaks Messages exclusively. Keep Galaris's
# OpenAI gateway through the upstream generic pi-ai adapter instead.
- id: llm-pi-ai
  config:
    providers:
      deepseek-official:
        displayName: Galaris
        api: openai-completions
        baseURL: !!js process.env.DEEPSEEK_BASE_URL
        apiKeyEnv: DEEPSEEK_API_KEY
        reasoning: !!js process.env.DSH_REASONING_EFFORT ?? 'high'
        retryPolicy:
          mode: normal
          maxRetries: 0
        compat:
          supportsReasoningEffort: true
          thinkingFormat: deepseek
          requiresReasoningContentOnAssistantMessages: true
        models:
          - id: !!js process.env.GALARIS_MODEL
            contextWindow: 262144
            maxTokens: 32768
            reasoningEfforts:
              low: low
              high: high
              max: max

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD

- id: bash-sandbox
  config:
    timeoutMs: 60000

- id: system-prompt
  config:
    persona: >-
      You execute bounded Galaris tasks. Galaris remains authoritative for memory,
      files, messages, permissions, and external effects. Use the galaris MCP tools
      for durable work and never treat your final prose as proof that an effect happened.

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: [/skills]
    watch: false

- id: tools
  config:
    maxParallelSubCalls: 1

# These independent workflows were absent from Galaris's former composition.
# Durable work, goals, subagents and external calls belong to Galaris's MCP API.
- id: tool-jobs
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-web
  disabled: true
- id: session-telemetry-otel
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: zstd

- id: tool-todo
  config:
    allowParallelInProgress: false

- id: compaction-basic
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

- insert:
    - id: galaris-authorizations
      name: /opt/galaris/authorization.mjs
    - id: mcp-galaris
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: galaris
        transport: streamable-http
        url: !!js process.env.GALARIS_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.GALARIS_MCP_TOKEN}`'
        toolCallTimeoutMs: 86400000
        failOnStartupError: true
