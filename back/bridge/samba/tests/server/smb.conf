[global]
server role = standalone server
server min protocol = SMB2_02
server signing = mandatory
map to guest = Never
log level = 0
load printers = no
disable spoolss = yes

[synthetic]
path = /shares/synthetic
valid users = writer reader
read only = no
read list = reader
create mask = 0660
directory mask = 2770
wide links = no
follow symlinks = no

[secondary]
path = /shares/secondary
valid users = writer reader
read only = no
read list = reader
wide links = no
follow symlinks = no

[restricted]
path = /shares/secondary
valid users = writer
read only = no
wide links = no
follow symlinks = no
