[run]
branch = True
concurrency = multiprocessing
sigterm = True
# A common root preserves core/app/bridge in XML filenames (and avoids collisions).
source = .
omit =
    */tests/*
    */default-agent/*

[report]
include = core/*, app/*, bridge/*
show_missing = True
# Global measurement is diagnostic; reviewed critical floors remain mandatory.
fail_under = 0
