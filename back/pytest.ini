[pytest]
cache_dir = /tmp/pytest_cache
asyncio_mode = strict
# `app` used to be a namespace package. Keep this option so pytest always names test
# modules with their complete package path and never imports SQLAlchemy models twice.
consider_namespace_packages = true
addopts = --import-mode=importlib
norecursedirs = tests/manual
filterwarnings =
    error::RuntimeWarning
    error::sqlalchemy.exc.SAWarning
    ignore:.*asyncio.get_event_loop_policy.*:DeprecationWarning
    ignore:.*asyncio.set_event_loop_policy.*:DeprecationWarning
